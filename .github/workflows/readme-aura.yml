name: Generate README

on:
  push:
    branches: [main]
    paths: ['readme.source.md']
  schedule:
    # Daily refresh to keep dynamic SVG state fresh
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean attribution & references
        run: |
          sed -i 's/ "Generated by readme-aura"//g' README.md
          find .github/assets -name "*.svg" -exec sed -i '/Generated by readme-aura/d' {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: strip generator references" && git push)
